<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luminous High-Contrast White/Light Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Subtle inner radial glow -->
  <circle cx="64" cy="64" r="50" fill="#f0f9ff" opacity="0.8"/>

  <!-- Nordic Modern House Architecture Geometry -->
  <!-- Outer Main House Peak -->
  <path d="M 64 22 L 102 54 L 92 54 L 92 98 L 36 98 L 36 54 L 26 54 Z" fill="url(#blueGrad)" filter="url(#glow)"/>

  <!-- Left Architectural Facet / Modern Overhang -->
  <path d="M 64 22 L 36 54 L 46 54 L 46 98 L 64 98 Z" fill="#1d4ed8" opacity="0.9"/>

  <!-- Cyan Inner Portal Arch / Roof Line -->
  <path d="M 64 36 L 86 54 L 78 54 L 78 90 L 50 90 L 50 54 L 42 54 Z" fill="#ffffff"/>

  <!-- Inner Cyan House Portal -->
  <path d="M 64 42 L 80 56 L 74 56 L 74 86 L 54 86 L 54 56 L 48 56 Z" fill="url(#cyanGrad)"/>

  <!-- Golden Warm Window / Keyhole representing Danish Home / bopæl -->
  <rect x="58" y="66" width="12" height="16" rx="4" fill="url(#goldGrad)"/>
  <circle cx="64" cy="62" r="3.5" fill="url(#goldGrad)"/>

  <!-- Small Danish Flag Minimal Accent dot -->
  <circle cx="100" cy="28" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
</svg>
